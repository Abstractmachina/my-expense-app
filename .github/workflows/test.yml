name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Node ships corepack, so pnpm comes from the runtime instead of pnpm/action-setup (which still targets Node 20).
      - run: corepack enable && corepack prepare pnpm@10 --activate

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
